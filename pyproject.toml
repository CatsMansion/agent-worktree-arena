[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-worktree-arena"
version = "0.1.0"
description = "Run and compare coding tasks in isolated Git worktrees."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Agent Worktree Arena contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
arena = "arena.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["arena"]
include-package-data = true

[tool.setuptools.package-data]
arena = ["../templates/report.html"]
